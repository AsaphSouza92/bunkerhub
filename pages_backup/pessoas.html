<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pessoas — Bunker Hub</title>

  <link rel="stylesheet" href="../styles/base/reset.css">
  <link rel="stylesheet" href="../styles/base/variables.css">
  <link rel="stylesheet" href="../styles/base/typography.css">
  <link rel="stylesheet" href="../styles/base/fonts.css">
  <link rel="stylesheet" href="../styles/base/utilities.css">
  <link rel="stylesheet" href="../styles/components/sidebar.css">
  <link rel="stylesheet" href="../styles/components/card.css">
  <link rel="stylesheet" href="../styles/components/button.css">
  <link rel="stylesheet" href="../styles/components/modal.css">
  <link rel="stylesheet" href="../styles/components/toast.css">
  <link rel="stylesheet" href="../styles/layouts/page-shell.css">
  <link rel="stylesheet" href="../styles/pages/pessoas.css">
</head>
<body>
  <div id="sidebar-overlay-mount"></div>

  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <div class="shell-body">
      <div id="mobile-header-mount"></div>

      <main class="content">
        <div class="page-header page-header--row">
          <div>
            <p class="page-header__greeting">Cuidado e acompanhamento</p>
            <h1>Pessoas</h1>
          </div>
          <button class="btn btn--primary" id="btn-nova-pessoa">+ Nova pessoa</button>
        </div>

        <div class="pessoas-toolbar">
          <input type="text" id="busca-input" placeholder="Buscar por nome...">
          <select id="filtro-funcao">
            <option value="">Todas as funções</option>
            <option value="Jovem">Jovem</option>
            <option value="Líder de Célula">Líder de Célula</option>
            <option value="Aspirante">Aspirante</option>
            <option value="Visitante">Visitante</option>
          </select>
        </div>

        <div class="pessoas-grid" id="pessoas-grid"></div>
      </main>
    </div>
  </div>

  <script type="module">
    import { montarSidebar } from '../scripts/components/Sidebar.js';
    montarSidebar('pessoas');
  </script>
  <script type="module" src="../scripts/pages/pessoas.page.js"></script>
</body>
</html>
