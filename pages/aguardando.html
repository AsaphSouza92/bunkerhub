<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aguardando aprovação — BunkerHub</title>

  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>

<body>

  <main class="login-shell">
    <section class="card login-card">

      <div class="login-card__brand">
        <h1>BunkerHub</h1>
        <p class="text-secondary">Gestão da Juventude Bunker</p>
      </div>

      <div class="mb-3">
        <h2>Cadastro realizado!</h2>

        <p class="text-secondary mt-2">
          Sua conta foi criada e seu e-mail foi confirmado.
        </p>

        <p class="text-secondary mt-2">
          Agora seu cadastro precisa ser aprovado por um administrador do BUNKER.
        </p>

        <p class="text-secondary mt-2">
          Depois da aprovação, você poderá entrar normalmente na plataforma.
        </p>
      </div>

      <a
        href="login.html"
        class="btn btn--primary w-full"
      >
        Voltar para o login
      </a>

    </section>
  </main>

</body>
</html>
