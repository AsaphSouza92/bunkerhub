<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunker Hub</title>

  <link rel="stylesheet" href="styles/base/reset.css">
  <link rel="stylesheet" href="styles/base/variables.css">
  <link rel="stylesheet" href="styles/base/typography.css">
  <link rel="stylesheet" href="styles/base/fonts.css">
  <link rel="stylesheet" href="styles/base/utilities.css">
  <link rel="stylesheet" href="styles/components/sidebar.css">
  <link rel="stylesheet" href="styles/components/card.css">
  <link rel="stylesheet" href="styles/components/button.css">
  <link rel="stylesheet" href="styles/components/modal.css">
  <link rel="stylesheet" href="styles/components/toast.css">
  <link rel="stylesheet" href="styles/layouts/page-shell.css">
</head>
<body>

  <div id="sidebar-overlay-mount"></div>

  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <div class="shell-body">
      <div id="mobile-header-mount"></div>

      <main class="content">
        <div class="page-header">
          <p class="page-header__greeting">Bem-vindo(a) de volta,</p>
          <h1>Juventude Bunker</h1>
        </div>

        <section class="dashboard-grid">
          <div class="card dashboard-grid__wide" id="widget-versiculo-card">
            <div class="card__header"><h3 class="card__title">✦ Versículo do Dia</h3></div>
            <div id="widget-versiculo"></div>
          </div>
          <div class="card">
            <div class="card__header"><h3 class="card__title">◆ Próximo Evento</h3></div>
            <div id="widget-evento"></div>
          </div>
          <div class="card">
            <div class="card__header"><h3 class="card__title">🎂 Aniversariantes</h3></div>
            <div id="widget-aniversarios"></div>
          </div>
          <div class="card">
            <div class="card__header"><h3 class="card__title">✓ Minhas Tarefas</h3></div>
            <div id="widget-tarefas"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module">
    import { montarSidebar } from './scripts/components/Sidebar.js';
    montarSidebar('dashboard');
  </script>
  <script type="module" src="scripts/core/app.js"></script>
</body>
</html>
