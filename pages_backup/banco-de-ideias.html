<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de Ideias — Bunker Hub</title>

  <link rel="stylesheet" href="../styles/base/reset.css">
  <link rel="stylesheet" href="../styles/base/variables.css">
  <link rel="stylesheet" href="../styles/base/typography.css">
  <link rel="stylesheet" href="../styles/base/fonts.css">
  <link rel="stylesheet" href="../styles/base/utilities.css">
  <link rel="stylesheet" href="../styles/components/sidebar.css">
  <link rel="stylesheet" href="../styles/components/card.css">
  <link rel="stylesheet" href="../styles/components/button.css">
  <link rel="stylesheet" href="../styles/components/modal.css">
  <link rel="stylesheet" href="../styles/components/toast.css">
  <link rel="stylesheet" href="../styles/layouts/page-shell.css">
  <link rel="stylesheet" href="../styles/pages/banco-de-ideias.css">
</head>
<body>
  <div id="sidebar-overlay-mount"></div>

  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <div class="shell-body">
      <div id="mobile-header-mount"></div>

      <main class="content">
        <div class="page-header page-header--row">
          <div>
            <p class="page-header__greeting">Onde toda boa ideia começa</p>
            <h1>Banco de Ideias</h1>
          </div>
          <button class="btn btn--primary" id="btn-nova-ideia">+ Nova ideia</button>
        </div>

        <div class="ideias-toolbar">
          <select id="filtro-categoria">
            <option value="">Todas as categorias</option>
            <option value="Evento">Evento</option>
            <option value="Discipulado">Discipulado</option>
            <option value="Melhoria">Melhoria</option>
            <option value="Geral">Geral</option>
          </select>
        </div>

        <div class="ideias-board" id="ideias-board"></div>
      </main>
    </div>
  </div>

  <script type="module">
    import { montarSidebar } from '../scripts/components/Sidebar.js';
    montarSidebar('ideias');
  </script>
  <script type="module" src="../scripts/pages/banco-de-ideias.page.js"></script>
</body>
</html>
